[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackveil"
version = "1.0.0"
description = "BLACKVEIL X - Advanced Cybersecurity Ecosystem & Isolated Sandbox Terminal Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "scapy>=2.5.0",
    "pyreadline3>=3.4.1; sys_platform == 'win32'",
]

[project.scripts]
blackveil = "main:cli_entry"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "core",
    "modules",
    "sandbox",
    "labs",
    "missions",
    "ai",
    "plugins",
    "automation",
    "database",
    "reports",
]
